<!DOCTYPE html>
<html lang="en">
<head>

<title>Nitro Traffic Escape</title>

<style>
:root{ --lime:#c6ff3d; --cyan:#00e5ff; --amber:#ffb84d; --red:#ff3b4e; --bg:#05070a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --fd:"Arial Black","Segoe UI",Impact,Arial,sans-serif; --fb:"Segoe UI",Roboto,Arial,sans-serif; }
*{margin:0;padding:0;box-sizing:border-box;}
html,body{ width:100%; height:100%; position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; font-family:var(--fb); overflow:hidden; user-select:none; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; -webkit-touch-callout:none; touch-action:none; overscroll-behavior:none; }
#arena{ position:absolute; width:100%; height:100%; inset:0; touch-action:none; overflow:hidden; }
canvas{ display:block; width:100%; height:100%; background:#0a0e14; }

/* HUD */
#hud{ position:absolute; inset:0; pointer-events:none; }
.hud-tl,.hud-tc{ position:absolute; top:calc(16px + var(--sat)); font-family:var(--fd); color:#fff; }
.hud-tl{ left:calc(18px + var(--sal)); } .hud-tc{ width:100%; text-align:center; }
.hud-tr-rekor{ position:absolute; top:calc(60px + var(--sat)); right:calc(18px + var(--sar)); text-align:right; font-family:var(--fd); color:#fff; }
.top-btn{ position:absolute; top:calc(16px + var(--sat)); width:36px; height:36px; background:rgba(5,7,10,0.6); border:1px solid rgba(0,229,255,0.4); color:#fff; border-radius:8px; font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto; transition:transform .1s; }
.top-btn:active{ transform:scale(0.9); }
#btn-pause{ right:calc(62px + var(--sar)); } #btn-mute{ right:calc(18px + var(--sar)); }
.hud-label{ font-size:10px; letter-spacing:2px; color:rgba(255,255,255,0.55); }
.hud-val{ font-size:20px; font-weight:900; color:var(--lime); text-shadow:0 0 12px rgba(198,255,61,0.6); }
.hud-val.best{ color:var(--amber); text-shadow:0 0 12px rgba(255,184,77,0.5); font-size:14px; }
.hud-val.speed{ color:var(--cyan); text-shadow:0 0 12px rgba(0,229,255,0.6); font-size:22px; }
.hud-val.speed span{ font-size:11px; color:rgba(255,255,255,0.7); text-shadow:none; }
#nitro-wrap{ position:absolute; left:calc(14px + var(--sal)); top:calc(120px + var(--sat)); width:120px; pointer-events:none; }
#nitro-label{ font-family:var(--fd); font-size:9px; letter-spacing:2px; color:rgba(255,255,255,0.5); margin-bottom:4px; }
#nitro-bar{ width:100%; height:8px; background:rgba(255,255,255,0.12); border-radius:4px; overflow:hidden; border:1px solid rgba(255,255,255,0.2); }
#nitro-fill{ height:100%; width:100%; background:linear-gradient(90deg,#00e5ff,#c6ff3d); border-radius:4px; transition:width .05s linear; }
#combo-wrap{ position:absolute; left:calc(14px + var(--sal)); top:calc(150px + var(--sat)); transition:opacity .1s; opacity:0; }
#combo-val{ font-family:var(--fd); font-weight:900; font-size:24px; color:var(--amber); text-shadow:0 0 15px var(--amber); }

/* MOBILE CONTROLS */
.control-btn{ position:absolute; bottom:calc(16px + var(--sab)); width:55px; height:55px; border-radius:50%; font-family:var(--fd); font-weight:900; font-size:10px; display:flex; align-items:center; justify-content:center; pointer-events:auto; letter-spacing:1px; transition:transform .1s; z-index:10; color:#fff; border:2px solid; user-select:none; -webkit-user-select:none; touch-action:none; }
.control-btn:active,.control-btn.active{ transform:scale(0.9); }
#btn-left{ left:calc(10px + var(--sal)); background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.2),rgba(255,255,255,0.05)); border-color:rgba(255,255,255,0.4); }
#btn-right{ left:calc(72px + var(--sal)); background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.2),rgba(255,255,255,0.05)); border-color:rgba(255,255,255,0.4); }
#btn-horn{ left:calc(134px + var(--sal)); background:radial-gradient(circle at 35% 30%,rgba(255,184,77,0.5),rgba(180,100,0,0.25)); border-color:var(--amber); box-shadow:0 0 20px rgba(255,184,77,0.3); }
#btn-brake{ right:calc(88px + var(--sar)); background:radial-gradient(circle at 35% 30%,rgba(255,59,78,0.5),rgba(180,0,0,0.25)); border-color:var(--red); box-shadow:0 0 25px rgba(255,59,78,0.35); }
#btn-brake.active{ background:radial-gradient(circle at 35% 30%,rgba(255,59,78,0.8),rgba(180,0,0,0.5)); }
#btn-gas{ right:calc(10px + var(--sar)); width:70px; height:70px; bottom:calc(8px + var(--sab)); background:radial-gradient(circle at 35% 30%,rgba(198,255,61,0.5),rgba(100,180,0,0.25)); border-color:var(--lime); box-shadow:0 0 25px rgba(198,255,61,0.35); font-size:12px; }
#btn-gas.active{ background:radial-gradient(circle at 35% 30%,rgba(198,255,61,0.8),rgba(100,180,0,0.5)); }
#btn-nos{ right:calc(15px + var(--sar)); bottom:calc(90px + var(--sab)); width:50px; height:50px; background:radial-gradient(circle at 35% 30%,rgba(0,229,255,0.5),rgba(0,150,180,0.25)); border-color:var(--cyan); box-shadow:0 0 20px rgba(0,229,255,0.35); }
#btn-nos.active{ background:radial-gradient(circle at 35% 30%,rgba(0,229,255,0.8),rgba(0,150,180,0.5)); }
.desktop-hide{ display:none !important; }
#keyboard-hint{ display:none; color:rgba(255,255,255,0.5); font-size:11px; margin-top:10px; letter-spacing:1px; }

/* SCREENS */
.screen{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .35s ease; background:rgba(5,7,10,0.85); backdrop-filter:blur(8px); z-index:20; padding:var(--sat) var(--sar) var(--sab) var(--sal); }
.screen.on{ opacity:1; pointer-events:all; }
.panel{ text-align:center; padding:20px; width:100%; max-width:400px; max-height:100%; overflow-y:auto; }
.logo{ font-family:var(--fd); font-weight:900; font-size:clamp(24px,7vw,34px); line-height:1; color:#fff; margin-bottom:18px; }
.logo span{ display:block; }
.logo .l2{ color:var(--lime); text-shadow:0 0 24px rgba(198,255,61,0.6); }
.best-row{ font-family:var(--fd); font-size:12px; color:rgba(255,255,255,0.6); margin-bottom:15px; letter-spacing:1px; line-height:1.8; }
.best-row b{ color:var(--amber); }
.lang-row{ display:flex; justify-content:center; gap:8px; margin-bottom:20px; }
.lang-btn{ background:transparent; border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.5); font-family:var(--fd); font-size:11px; padding:4px 8px; border-radius:4px; cursor:pointer; transition:.2s; }
.lang-btn.active{ background:rgba(0,229,255,0.2); color:var(--cyan); border-color:var(--cyan); }
.mod-selector{ display:flex; justify-content:center; gap:10px; margin-bottom:20px; }
.mod-btn{ padding:8px 15px; background:transparent; border:1px solid rgba(255,255,255,0.3); color:#fff; font-family:var(--fb); font-weight:700; border-radius:6px; cursor:pointer; transition:.2s; }
.mod-btn.active{ background:var(--cyan); color:#000; border-color:var(--cyan); box-shadow:0 0 15px rgba(0,229,255,0.5); }
button.game-btn{ padding:14px 30px; margin:5px; background:transparent; border:2px solid var(--lime); color:var(--lime); font-family:var(--fd); font-weight:700; font-size:13px; letter-spacing:3px; cursor:pointer; clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%); transition:background .2s,box-shadow .2s,color .2s; width:80%; }
button.game-btn:active{ background:var(--lime); color:#000; box-shadow:0 0 30px rgba(198,255,61,0.5); }
.btn-blue{ border-color:var(--cyan) !important; color:var(--cyan) !important; } .btn-blue:active{ background:var(--cyan) !important; color:#000 !important; box-shadow:0 0 30px rgba(0,229,255,0.5); }
.btn-amber{ border-color:var(--amber) !important; color:var(--amber) !important; } .btn-amber:active{ background:var(--amber) !important; color:#000 !important; box-shadow:0 0 30px rgba(255,184,77,0.5); }
.btn-purple{ border-color:#b388ff !important; color:#b388ff !important; } .btn-purple:active{ background:#b388ff !important; color:#000 !important; box-shadow:0 0 30px rgba(179,136,255,0.5); }
.crash-title{ color:var(--red); font-size:1.5em; text-shadow:0 0 18px rgba(255,59,78,0.7); font-family:var(--fd); font-weight:900; margin-bottom:6px; }
.crash-score{ font-family:var(--fd); font-size:30px; color:#fff; margin:10px 0 4px; }
.crash-new-best{ font-family:var(--fb); color:var(--amber); font-size:13px; letter-spacing:2px; margin-bottom:10px; display:none; }
.crash-sub{ font-family:var(--fb); color:rgba(255,255,255,0.5); font-size:12px; margin-bottom:8px; letter-spacing:1px; }
.book-panel{ background:#f4eecb; color:#3e2723; width:85%; max-width:360px; max-height:94%; overflow-y:auto; padding:25px; border-radius:4px; box-shadow:inset 0 0 20px rgba(0,0,0,0.1),0 10px 40px rgba(0,0,0,0.9); position:relative; text-align:left; border:2px solid #d7ccc8; display:flex; flex-direction:column; }
.book-close{ position:absolute; top:10px; right:15px; color:#d32f2f; font-size:22px; font-weight:bold; cursor:pointer; font-family:sans-serif; transition:transform .1s; }
.book-close:active{ transform:scale(0.8); }
.book-title{ font-family:var(--fd); font-size:16px; font-weight:900; margin-bottom:15px; border-bottom:2px solid #8d6e63; padding-bottom:8px; text-align:center; }
.book-text{ font-size:13px; line-height:1.6; font-weight:600; letter-spacing:.5px; margin-bottom:15px; }
.book-text b{ color:#d32f2f; }
.book-section-title{ font-size:15px; text-align:center; color:#d32f2f; margin:10px 0 5px; font-weight:900; }
.lb-box{ background:rgba(0,0,0,0.05); border:1px solid rgba(0,0,0,0.1); border-radius:8px; padding:10px; margin-bottom:10px; text-align:center; }
.lb-label{ font-family:var(--fb); font-weight:700; font-size:14px; color:#5d4037; }
.lb-val{ font-family:var(--fd); font-size:22px; font-weight:900; color:#d32f2f; margin-top:4px; }
.pause-title{ color:#fff; font-size:1.5em; text-shadow:0 0 18px rgba(255,255,255,0.5); font-family:var(--fd); font-weight:900; margin-bottom:20px; }

/* SMALL SCREENS (e.g. 800x450, 640x360) */
@media (max-height:450px){
  .panel{ padding:8px; }
  .logo{ font-size:24px; margin-bottom:8px; }
  .lang-row{ margin-bottom:8px; }
  .mod-selector{ margin-bottom:8px; }
  .mod-btn{ padding:5px 10px; font-size:12px; }
  .best-row{ margin-bottom:6px; }
  button.game-btn{ padding:8px 20px; margin:3px; font-size:11px; }
  #keyboard-hint{ margin-top:4px; }
  .crash-score{ font-size:24px; margin:4px 0; }
  .pause-title{ margin-bottom:8px; }
  .book-panel{ padding:12px; }
  .book-title{ font-size:14px; margin-bottom:6px; }
  .book-text{ font-size:11px; line-height:1.4; margin-bottom:8px; }
  .lb-box{ padding:6px; margin-bottom:6px; }
  .lb-val{ font-size:18px; }
}
</style>
</head>
<body>
<div id="arena">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hud-tl"><div class="hud-label" data-i18n="dist">DISTANCE</div><div class="hud-val" id="hud-score">0m</div></div>
    <div class="hud-tc"><div class="hud-label" data-i18n="speed">SPEED</div><div class="hud-val speed" id="hud-speed">0 <span>km/h</span></div></div>

  <div id="btn-brake" class="control-btn" data-i18n="brake">BRAKE</div>
  <div id="btn-nos" class="control-btn" data-i18n="nos">NOS</div>

  <div id="start-screen" class="screen on">
    <div class="panel">
      <div class="logo"><span data-i18n="title1">NITRO TRAFFIC</span><span class="l2" data-i18n="title2">ESCAPE</span></div>
      <div class="lang-row">
        <button class="lang-btn" onclick="setLang('en',true)" id="lang-en">EN</button>
        <button class="lang-btn" onclick="setLang('tr',true)" id="lang-tr">TR</button>
        <button class="lang-btn" onclick="setLang('es',true)" id="lang-es">ES</button>
        <button class="lang-btn" onclick="setLang('ru',true)" id="lang-ru">RU</button>
        <button class="lang-btn" onclick="setLang('zh',true)" id="lang-zh">ZH</button>
      </div>

        <button class="mod-btn" id="mod-oneway" data-i18n="oneway">ONE WAY</button>

      </div>
      <div class="best-row"><span data-i18n="best">BEST</span>: <b id="start-best">0m</b></div>

      <button class="game-btn btn-purple" id="btn-leaderboard" data-i18n="lb">BEST SCORES</button>

<script>
/* ============== GLOBAL STATE ============== */
let state = 'title';      // title | play | crash
let adPlaying = false;
let isPaused = false;
let booted = false;
function $(id) { return document.getElementById(id); }

/* ============== CRAZYGAMES SDK (safe if SDK is missing / blocked by AdBlock) ============== */
const CG = {
  ready: false, playing: false,
  sdk() { return (window.CrazyGames && window.CrazyGames.SDK) || null; },
  async init() {
    const s = this.sdk(); if (!s) return;
    try {
      await Promise.race([
        Promise.resolve(s.init()).then(() => { this.ready = true; }),
        new Promise(r => setTimeout(r, 3000))
      ]);
    } catch (e) {}
  },
  loadingStart() { try { if (this.sdk() && this.sdk().game.loadingStart) this.sdk().game.loadingStart(); } catch (e) {} },
  loadingStop() { try { if (this.sdk() && this.sdk().game.loadingStop) this.sdk().game.loadingStop(); } catch (e) {} },
  gameplayStart() { if (this.playing) return; this.playing = true; try { if (this.ready) this.sdk().game.gameplayStart(); } catch (e) {} },
  gameplayStop() { if (!this.playing) return; this.playing = false; try { if (this.ready) this.sdk().game.gameplayStop(); } catch (e) {} },
  locale() { try { if (this.ready) return this.sdk().user.systemInfo.locale || ''; } catch (e) {} return ''; },
  adBreak() {
    this.gameplayStop();
    adPlaying = true; stopEngine(); stopNitroSound();
    return new Promise(resolve => {
      let finished = false;
      const began = () => { if (audioCtx) { try { audioCtx.suspend(); } catch (e) {} } };
      const done = () => {
        if (finished) return; finished = true;
        adPlaying = false;
        if (audioCtx) { try { audioCtx.resume(); } catch (e) {} }
        resolve();
      };
      const s = this.sdk();
      if (!this.ready || !s || !s.ad) { done(); return; }
      try { s.ad.requestAd('midgame', { adStarted: began, adFinished: done, adError: done }); }
      catch (e) { done(); }
    });
  }
};

/* ============== STORAGE (CrazyGames Data module, falls back to localStorage) ============== */
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : v; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
function dataGet(k, def) {
  try { if (CG.ready && CG.sdk().data) { const v = CG.sdk().data.getItem(k); if (v !== null && v !== undefined) return v; } } catch (e) {}
  return lsGet(k, def);
}
function dataSet(k, v) {
  try { if (CG.ready && CG.sdk().data) CG.sdk().data.setItem(k, String(v)); } catch (e) {}
  lsSet(k, v);
}

/* ============== TRANSLATIONS ============== */

function updatePopups() { for (let i = popups.length - 1; i >= 0; i--) { popups[i].life -= 0.018; popups[i].y -= 0.8; if (popups[i].life <= 0) popups.splice(i, 1); } }
function drawPopups() { popups.forEach(p => { G.save(); G.globalAlpha = Math.max(0, p.life); G.font = 'bold 14px Arial, sans-serif'; G.fillStyle = p.col; G.textAlign = 'center'; G.fillText(p.text, p.x, p.y); G.restore(); }); }
function shake(amt) { shakeAmt = Math.max(shakeAmt, amt); }

/* ============== CONTROLS ============== */
function bindBtn(el, down, up) {
  el.onpointerdown = (e) => { e.preventDefault(); down(); el.classList.add('active'); getAudio(); };
  el.onpointerup = (e) => { e.preventDefault(); up(); el.classList.remove('active'); };
  el.onpointerleave = () => { up(); el.classList.remove('active'); };

bindBtn($('btn-gas'), () => gasHeld = true, () => gasHeld = false);
bindBtn($('btn-brake'), () => brakeHeld = true, () => brakeHeld = false);

bindBtn($('btn-left'), () => leftHeld = true, () => leftHeld = false);

/* Physical key codes (e.code): WASD stays in the same place on AZERTY keyboards (ZQSD). ESC is NOT used (it exits fullscreen). */
const GAME_KEYS = ['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS', 'KeyK'];
window.addEventListener('keydown', (e) => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP') { if (!adPlaying) setPaused(!isPaused); return; }
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') leftHeld = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') rightHeld = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') gasHeld = true;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') brakeHeld = true;
  if (e.code === 'Space') nosHeld = true;
  if (e.code === 'KeyK' && state === 'play' && !isPaused) { sfx('horn'); triggerHorn(); }
}, { passive: false });
window.addEventListener('keyup', (e) => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') leftHeld = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') rightHeld = false;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') gasHeld = false;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') brakeHeld = false;
  if (e.code === 'Space') { nosHeld = false; sfx('nitro_off'); }
}, { passive: false });

/* ============== HELPERS ============== */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function getNightFactor() { const ph = (tick % 18000) / 18000; if (ph < 0.45) return 0; if (ph < 0.55) return (ph - 0.45) * 10; if (ph < 0.90) return 1; return Math.max(0, 1 - ((ph - 0.90) * 10)); }
function roundRectPath(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function checkCollision(a, b) { return !(b.x - b.w / 2 > a.x + a.w / 2 || b.x + b.w / 2 < a.x - a.w / 2 || b.y - b.h / 2 > a.y + a.h / 2 || b.y + b.h / 2 < a.y - a.h / 2); }

function resetGameVars() {
  score = 0; tick = 0; currentSpeed = 0; acc = 0;
  traffic.length = 0; pickups.length = 0; particles.length = 0; popups.length = 0; skids.length = 0;
  nitroFuel = 100; nitroDepleted = false;
  gasHeld = brakeHeld = nosHeld = leftHeld = rightHeld = wasNosHeld = false;
  combo = 1; comboTimer = 0;
  player.lane = 2; player.x = LANE_X[2]; player.targetX = LANE_X[2]; player.y = H - 150;
  lineRideTimer = 0; spawnTimer = 20; pickupTimer = 220; wrongWayTimer = 0; wrongWayArmed = true; shakeAmt = 0; isPaused = false;
  stopNitroSound();
}

function startGame() {
  getAudio(); stopEngine(); startEngine();
  state = 'play'; resetGameVars();
  $('pause-screen').classList.remove('on'); $('btn-pause').innerText = '⏸';
  document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('active'));
  $('start-screen').classList.remove('on'); $('gameover-screen').classList.remove('on');
  updateHud(); lastTime = performance.now(); acc = 0;
  CG.gameplayStart();
}

function crash() {
  if (state !== 'play') return;
  state = 'crash'; stopEngine(); sfx('crash'); stopNitroSound(); shake(14);
  burst(player.x, player.y, '#ff3b4e', '#ffb84d', 46);
  CG.gameplayStop();
  if (Math.round(score) > best) {
    best = Math.round(score);
    if (isTwoWay) { bestTwoWay = best; dataSet('trafficEscape_TwoWay', bestTwoWay); } else { bestOneWay = best; dataSet('trafficEscape_OneWay', bestOneWay); }
    $('go-newbest').style.display = 'block';
  } else { $('go-newbest').style.display = 'none'; }
  setTimeout(() => {
    if (state !== 'crash') return;
    $('go-score').textContent = Math.round(score) + 'm'; $('go-best').textContent = best + 'm';
    $('gameover-screen').classList.add('on');
  }, 650);
}

function updateHud() {
  $('hud-score').textContent = Math.round(score) + 'm'; $('hud-best').textContent = best + 'm';
  $('nitro-fill').style.width = nitroFuel + '%'; $('btn-nos').style.opacity = nitroFuel > 2 ? '1' : '0.4';
  $('hud-speed').innerHTML = Math.round(currentSpeed * 14.5) + ' <span>km/h</span>';
  $('combo-wrap').style.opacity = combo > 1 ? (comboTimer < 60 ? (Math.floor(tick / 10) % 2 === 0 ? '1' : '0.3') : '1') : '0';
  $('combo-val').textContent = 'x' + combo;
}

/* ============== TRAFFIC ============== */
const CAR_COLORS = ['#e0463c', '#3fa9f5', '#f5c542', '#8e6bd8', '#4caf6a', '#f57f42', '#ffffff', '#222222'];
const BUS_COLORS = ['#f5b400', '#e8e8e8', '#3fa9f5'];
const TRUCK_COLORS = ['#e6e6e6', '#c62828', '#2e5eaa', '#f5f5f5'];
const NPC_TYPES = ['car', 'car', 'car', 'car', 'car', 'bus', 'truck_trailer', 'racer', 'racer'];

function spawnTraffic() {
  const lane = Math.floor(Math.random() * 4), laneX = LANE_X[lane], type = NPC_TYPES[Math.floor(Math.random() * NPC_TYPES.length)];
  let w = 30, h = 54, isCrazy = false, baseSpeed = 1.5 + Math.random() * 3.5, forcedColor = null;
  if (type === 'bus') { w = 36; h = 118; baseSpeed = 1.2 + Math.random() * 1.6; forcedColor = BUS_COLORS[Math.floor(Math.random() * BUS_COLORS.length)]; }
  else if (type === 'truck_trailer') { w = 38; h = 190; baseSpeed = 1.0 + Math.random() * 1.3; forcedColor = TRUCK_COLORS[Math.floor(Math.random() * TRUCK_COLORS.length)]; }
  else if (type === 'racer') { w = 30; h = 56; baseSpeed = 4.5 + Math.random() * 3; isCrazy = true; }
  else { isCrazy = Math.random() < Math.min(0.15 + (score / 15000), 0.60); }
  const oncoming = isTwoWay ? (lane < 2) : false;
  let ownSpeed;
  if (oncoming) { if (type === 'bus' || type === 'truck_trailer') ownSpeed = -(1.5 + Math.random() * 1.5); else if (type === 'racer') ownSpeed = -(3.0 + Math.random() * 2.0); else ownSpeed = -(2.0 + Math.random() * 2.5); }
  else ownSpeed = baseSpeed;
  const spawnY = oncoming ? -400 : (ownSpeed > currentSpeed + 0.5 ? H + 400 : -400);
  if (traffic.some(c => c.lane === lane && Math.abs(c.y - spawnY) < (h / 2 + c.h / 2 + 60))) return;
  traffic.push({ x: laneX, y: spawnY, w, h, lane, ownSpeed, color: forcedColor || CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)], oncoming, passed: false, nearMissAwarded: false, type, isCrazy, aiState: 'wait', aiTimer: (type === 'racer' ? 20 : 60) + Math.random() * 50, turnSignal: 0, targetLaneX: laneX, targetLane: lane });
}
function spawnPickup() { pickups.push({ x: LANE_X[Math.floor(Math.random() * 4)], y: -60, r: 12, collected: false }); }

function triggerHorn() {
  traffic.forEach(c => {
    if (!c.oncoming && c.lane === player.lane && c.y < player.y && player.y - c.y < 300) {
      const opts = [];
      if (isTwoWay) { if (c.lane === 2) opts.push(3); if (c.lane === 3) opts.push(2); }
      else { if (c.lane > 0) opts.push(c.lane - 1); if (c.lane < 3) opts.push(c.lane + 1); }
      for (const l of opts) {
        if (!traffic.some(o => o !== c && o.lane === l && Math.abs(o.y - c.y) < 200)) {
          c.aiState = 'signaling'; c.aiTimer = 15; c.targetLane = l; c.targetLaneX = LANE_X[l]; c.turnSignal = l > c.lane ? 1 : -1; break;
        }
      }
    }
  });
}

/* ============== PHYSICS ============== */
function updatePhysics() {
  let targetSpeed = COAST_SPEED;
  const canNitro = nosHeld && nitroFuel > 0 && !nitroDepleted;
  if (canNitro) {
    if (!wasNosHeld) { sfx('nitro_on'); wasNosHeld = true; }
    targetSpeed = NOS_SPEED; nitroFuel -= NITRO_DRAIN;
    if (nitroFuel <= 0) { nitroFuel = 0; nitroDepleted = true; sfx('nitro_off'); }
  } else {
    if (wasNosHeld) { sfx('nitro_off'); wasNosHeld = false; }
    nitroFuel = Math.min(100, nitroFuel + NITRO_AUTO_REGEN);
    if (gasHeld) targetSpeed = GAS_SPEED;
  }
  if (!nosHeld) nitroDepleted = false;
  if (brakeHeld) {
    targetSpeed = BRAKE_SPEED;
    if (currentSpeed > 5) { if (tick % 5 === 0) sfx('brake'); skids.push({ x: player.x - 10, y: player.y + 20, life: 1 }); skids.push({ x: player.x + 10, y: player.y + 20, life: 1 }); }
  }
  if (currentSpeed < targetSpeed) currentSpeed += ACCEL; else if (currentSpeed > targetSpeed) currentSpeed -= brakeHeld ? BRAKE_DECEL : DECEL;
  if (isNaN(currentSpeed) || currentSpeed < 0) currentSpeed = 0;
  if (engineOsc && audioCtx) {
    let pitch = 35 + currentSpeed * 6; if (nosHeld && nitroFuel > 0 && !nitroDepleted) pitch += 30;
    try { engineOsc.frequency.setValueAtTime(pitch, audioCtx.currentTime); if (engineOsc2) engineOsc2.frequency.setValueAtTime(pitch * 0.5, audioCtx.currentTime); } catch (e) {}
  }
}

function updatePlayer() {
  if (leftHeld) player.targetX -= STEER_SPEED;
  if (rightHeld) player.targetX += STEER_SPEED;
  player.targetX = clamp(player.targetX, ROAD_X + 24, ROAD_X + ROAD_W - 24);
  player.x += (player.targetX - player.x) * (STEER_SPEED * 0.035);
  player.lane = clamp(Math.floor((player.x - ROAD_X) / LANE_W), 0, 3);
  const d1 = Math.abs(player.x - (ROAD_X + LANE_W)), d2 = Math.abs(player.x - (ROAD_X + LANE_W * 2)), d3 = Math.abs(player.x - (ROAD_X + LANE_W * 3));
  if (Math.min(d1, d2, d3) < 14) {
    lineRideTimer++;
    if (lineRideTimer > 20) {
      currentSpeed *= 0.96; if (currentSpeed > 5) shake(1.5);
      if (tick % 5 === 0) burst(player.x, player.y + 20, '#555', '#333', 5);
      if (combo > 1) { combo = 1; popup(player.x, player.y - 30, t('pop_combo'), '#ff3b4e'); }
    }
  } else lineRideTimer = 0;
  const isWrongWay = isTwoWay && player.x < (ROAD_X + ROAD_W / 2);
  if (isWrongWay && currentSpeed > 4) {
    wrongWayTimer++;
    if (wrongWayTimer > 45 && wrongWayArmed) {
      comboTimer = 300; const pts = 50 * combo; score += pts;
      popup(player.x, player.y - 40, '+' + pts + ' ' + t('pop_wrong') + ' x' + combo, '#ff3b4e'); combo++; wrongWayArmed = false;
    }
  } else { wrongWayTimer = 0; if (!isWrongWay) wrongWayArmed = true; }
}

function updateTraffic() {
  for (let i = traffic.length - 1; i >= 0; i--) {
    const c = traffic[i];
    if (c.isCrazy && c.aiState === 'wait') {
      c.aiTimer--;
      if (c.aiTimer <= 0) {
        if (c.type !== 'racer' && Math.random() < 0.3) { c.aiState = 'braking'; c.ownSpeed = c.oncoming ? -1.5 : 1.5; }
        else {
          const opts = [];
          if (c.oncoming) { if (c.lane === 1) opts.push(0); if (c.lane === 0) opts.push(1); }
          else if (isTwoWay) { if (c.lane === 2) opts.push(3); if (c.lane === 3) opts.push(2); }
          else { if (c.lane > 0) opts.push(c.lane - 1); if (c.lane < 3) opts.push(c.lane + 1); }
          if (opts.length > 0) {
            const nl = opts[0];
            if (!traffic.some(o => o !== c && o.lane === nl && Math.abs(o.y - c.y) < 180)) {
              c.aiState = 'signaling'; c.aiTimer = c.type === 'racer' ? 15 : 45; c.targetLane = nl; c.targetLaneX = LANE_X[nl]; c.turnSignal = nl > c.lane ? 1 : -1;
            } else { c.aiState = 'braking'; c.ownSpeed = c.oncoming ? -1.0 : 1.0; }
          }
        }
      }
    } else if (c.aiState === 'signaling') {
      c.aiTimer--; if (c.aiTimer <= 0) { c.aiState = 'changing'; c.lane = c.targetLane; }
    } else if (c.aiState === 'changing') {
      c.x += (c.targetLaneX - c.x) * (c.type === 'racer' ? 0.1 : 0.05);
      if (Math.abs(c.x - c.targetLaneX) < 2) { c.x = c.targetLaneX; c.aiState = 'wait'; c.turnSignal = 0; c.aiTimer = c.type === 'racer' ? 30 : 120; }
    }
    for (let j = 0; j < traffic.length; j++) {
      if (i === j) continue; const o = traffic[j];
      if (c.lane === o.lane && c.aiState !== 'changing' && o.aiState !== 'changing' && c.oncoming === o.oncoming) {
        const gap = c.h / 2 + o.h / 2 + 25;
        if (!c.oncoming && c.y > o.y && c.y - o.y < gap) { c.ownSpeed = Math.min(c.ownSpeed, o.ownSpeed); c.y = o.y + gap; }
        else if (c.oncoming && c.y < o.y && o.y - c.y < gap) { c.ownSpeed = Math.max(c.ownSpeed, o.ownSpeed); c.y = o.y - gap; }
      }
    }
    if (!c.oncoming && Math.abs(c.x - player.x) <= LANE_W * 0.8 && c.y > player.y && c.y - player.y < (100 + c.h / 2) && c.ownSpeed > currentSpeed) { c.ownSpeed = currentSpeed; c.aiState = 'braking'; }
    c.y += (currentSpeed - c.ownSpeed);
    if (checkCollision({ x: player.x, y: player.y, w: player.w - 4, h: player.h - 6 }, { x: c.x, y: c.y, w: c.w - 4, h: c.h - 6 })) crash();
    if (!c.passed && c.y > player.y + (c.h / 2 + 20)) {
      c.passed = true;
      if (!c.oncoming && currentSpeed > 4 && Math.abs(c.x - player.x) <= LANE_W * 1.2) {
        comboTimer = 300; const pts = 15 * combo; score += pts;
        popup(c.x, player.y - 30, '+' + pts + ' ' + t('pop_overtake') + ' x' + combo, '#c6ff3d'); combo++;
      }
    }
    if (!c.nearMissAwarded && Math.abs(c.y - player.y) < (c.h / 2 + 20) && currentSpeed > 4) {
      const g = Math.abs(c.x - player.x) - (c.w + player.w) / 2;
      if (g > 0 && g < 22) {
        c.nearMissAwarded = true; comboTimer = 300; const pts = 40 * combo; score += pts;
        popup(player.x, player.y - 50, '+' + pts + ' ' + t('pop_near') + ' x' + combo, '#00e5ff'); sfx('nearmiss'); combo++;
      }
    }
    if (c.y > H + 500 || c.y < -500) traffic.splice(i, 1);
  }
}

function updatePickups() {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i]; p.y += currentSpeed;
    if (!p.collected && Math.abs(p.x - player.x) < 32 && Math.abs(p.y - player.y) < 42) {
      p.collected = true; score += 30; nitroFuel = Math.min(100, nitroFuel + 40);
      popup(p.x, p.y - 20, t('pop_nos'), '#ffb84d'); sfx('pickup');
    }
    if (p.collected || p.y > H + 60) pickups.splice(i, 1);
  }
}

/* ============== DRAWING ============== */
function drawBackground() {
  const night = state === 'title' ? 0 : getNightFactor();
  const g = G.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgb(${Math.round(77 - 71 * night)},${Math.round(166 - 150 * night)},${Math.round(255 - 223 * night)})`); g.addColorStop(1, '#05070a');
  G.fillStyle = g; G.fillRect(0, 0, W, H);
  if (night > 0.1) {
    G.save(); G.fillStyle = '#fff';
    bgStars.forEach(s => { G.globalAlpha = (Math.sin(tick * 0.05 + s.a * 10) * 0.5 + 0.5) * night; G.beginPath(); G.arc(s.x * W, s.y * H, s.s, 0, Math.PI * 2); G.fill(); s.y += currentSpeed * 0.00002; if (s.y > 1) { s.y = 0; s.x = Math.random(); } });
    G.restore();
  }
  bgOffset += currentSpeed * 0.25; G.save(); G.globalAlpha = 0.5 - night * 0.2;
  for (let i = 0; i < Math.ceil(W / 130) + 2; i++) { const hx = i * 130 - (bgOffset % 130); G.fillStyle = i % 2 === 0 ? '#141f38' : '#101a30'; G.beginPath(); G.moveTo(hx, 160); G.lineTo(hx + 65, 120); G.lineTo(hx + 130, 160); G.closePath(); G.fill(); }
  G.restore();
  G.fillStyle = `rgb(${Math.round(42 - 42 * night)},${Math.round(77 - 77 * night)},${Math.round(46 - 46 * night)})`;
  G.fillRect(0, 0, ROAD_X, H); G.fillRect(ROAD_X + ROAD_W, 0, W - (ROAD_X + ROAD_W), H);
}

function drawRoad() {
  G.fillStyle = '#262933'; G.fillRect(ROAD_X, 0, ROAD_W, H); roadDashOffset += currentSpeed;
  const stripeH = 26;
  [ROAD_X - 8, ROAD_X + ROAD_W - 4].forEach(sx => { for (let y = -stripeH + (roadDashOffset % (stripeH * 2)); y < H; y += stripeH * 2) { G.fillStyle = '#ddd'; G.fillRect(sx, y, 8, stripeH); G.fillStyle = '#c0392b'; G.fillRect(sx, y + stripeH, 8, stripeH); } });
  G.fillStyle = 'rgba(10,10,10,0.5)';
  for (let i = skids.length - 1; i >= 0; i--) { const s = skids[i]; s.y += currentSpeed; s.life -= 0.015; if (s.life <= 0) skids.splice(i, 1); else { G.globalAlpha = s.life; G.beginPath(); G.arc(s.x, s.y, 3, 0, Math.PI * 2); G.fill(); } }
  G.globalAlpha = 1;
  const dashLen = 35, gapLen = 25;
  const dashed = (x) => { for (let y = -dashLen + (roadDashOffset % (dashLen + gapLen)); y < H; y += dashLen + gapLen) { G.beginPath(); G.moveTo(x, y); G.lineTo(x, y + dashLen); G.stroke(); } };
  G.strokeStyle = 'rgba(255,255,255,0.7)'; G.lineWidth = 3; dashed(ROAD_X + LANE_W);
  const divX2 = ROAD_X + LANE_W * 2;
  if (isTwoWay) { G.strokeStyle = '#f5c542'; G.lineWidth = 2.5; G.beginPath(); G.moveTo(divX2 - 3, 0); G.lineTo(divX2 - 3, H); G.stroke(); G.beginPath(); G.moveTo(divX2 + 3, 0); G.lineTo(divX2 + 3, H); G.stroke(); }
  else { G.strokeStyle = 'rgba(255,255,255,0.7)'; G.lineWidth = 3; dashed(divX2); }
  G.strokeStyle = 'rgba(255,255,255,0.7)'; G.lineWidth = 3; dashed(ROAD_X + LANE_W * 3);
}

function drawCar(x, y, w, h, col, facingDown, isP, brk, sig, carType) {
  const night = state === 'title' ? 0 : getNightFactor();
  G.save(); G.translate(x, y);
  G.fillStyle = 'rgba(0,0,0,0.4)'; G.beginPath(); G.ellipse(0, h / 2 + 4, w / 2, 6, 0, 0, Math.PI * 2); G.fill();
  if (carType === 'truck_trailer') {
    const cabH = 26, cabY = facingDown ? -h / 2 : h / 2 - cabH;
    G.fillStyle = '#2b2f36'; roundRectPath(G, -w / 2 + 2, cabY, w - 4, cabH, 4); G.fill(); G.strokeStyle = 'rgba(0,0,0,0.6)'; G.lineWidth = 1.5; G.stroke();
    G.fillStyle = 'rgba(20,28,40,0.9)'; roundRectPath(G, -w / 2 + 5, facingDown ? cabY + 4 : cabY + cabH - 14, w - 10, 10, 2); G.fill();
    const gapY = facingDown ? cabY + cabH : cabY - 6; G.fillStyle = '#111'; G.fillRect(-3, gapY, 6, 6);
    const trailerH = h - cabH - 6, trailerY = facingDown ? cabY + cabH + 6 : -h / 2;
    G.fillStyle = col; roundRectPath(G, -w / 2, trailerY, w, trailerH, 3); G.fill(); G.strokeStyle = 'rgba(0,0,0,0.45)'; G.lineWidth = 1.5; G.stroke();
    G.strokeStyle = 'rgba(0,0,0,0.15)'; G.lineWidth = 1;
    for (let ly = trailerY + 10; ly < trailerY + trailerH - 6; ly += 14) { G.beginPath(); G.moveTo(-w / 2 + 3, ly); G.lineTo(w / 2 - 3, ly); G.stroke(); }
    G.fillStyle = 'rgba(255,60,60,0.7)'; G.fillRect(-w / 2 + 1, trailerY + trailerH - 8, w - 2, 3);
  } else if (carType === 'bus') {
    G.fillStyle = col; roundRectPath(G, -w / 2, -h / 2, w, h, 8); G.fill(); G.strokeStyle = 'rgba(0,0,0,0.5)'; G.lineWidth = 1.5; G.stroke();
    G.fillStyle = 'rgba(20,20,25,0.35)'; G.fillRect(-w / 2, h / 2 - 14, w, 14);
    G.fillStyle = 'rgba(20,28,40,0.9)'; roundRectPath(G, -w / 2 + 3, -h / 2 + 14, w - 6, h - 32, 3); G.fill();
    G.strokeStyle = 'rgba(0,0,0,0.5)'; G.lineWidth = 2;
    for (let seg = 1; seg <= 4; seg++) { const ly = -h / 2 + 14 + (h - 32) * (seg / 5); G.beginPath(); G.moveTo(-w / 2 + 3, ly); G.lineTo(w / 2 - 3, ly); G.stroke(); }
    G.fillStyle = 'rgba(255,255,255,0.85)'; roundRectPath(G, -w / 2 + 6, facingDown ? h / 2 - 13 : -h / 2 + 3, w - 12, 7, 2); G.fill();
  } else if (carType === 'racer') {
    G.fillStyle = col; roundRectPath(G, -w / 2, -h / 2, w, h, 6); G.fill(); G.strokeStyle = 'rgba(0,0,0,0.5)'; G.lineWidth = 1.5; G.stroke();
    G.fillStyle = 'rgba(255,255,255,0.8)'; G.fillRect(-4, -h / 2, 2, h); G.fillRect(2, -h / 2, 2, h);
    G.fillStyle = 'rgba(20,28,40,0.85)'; roundRectPath(G, -w / 2 + 4, facingDown ? -h / 2 + 12 : h * 0.1, w - 8, h * 0.25, 4); G.fill(); roundRectPath(G, -w / 2 + 5, facingDown ? h * 0.2 : -h / 2 + 10, w - 10, h * 0.15, 2); G.fill();
    G.fillStyle = '#111'; roundRectPath(G, -w / 2 - 2, facingDown ? -h / 2 + 2 : h / 2 - 6, w + 4, 4, 2); G.fill();
  } else {
    G.fillStyle = col; roundRectPath(G, -w / 2, -h / 2, w, h, 6); G.fill(); G.strokeStyle = 'rgba(0,0,0,0.5)'; G.lineWidth = 1.5; G.stroke();
    G.fillStyle = 'rgba(20,28,40,0.85)'; roundRectPath(G, -w / 2 + 4, facingDown ? -h / 2 + 8 : h * 0.02, w - 8, h * 0.32, 4); G.fill(); roundRectPath(G, -w / 2 + 5, facingDown ? h * 0.1 : -h / 2 + 6, w - 10, h * 0.15, 2); G.fill();
  }
  if (isP) {
    G.fillStyle = '#fff'; G.fillRect(-w / 2 + 3, -h / 2 - 2, 6, 4); G.fillRect(w / 2 - 9, -h / 2 - 2, 6, 4);
    G.fillStyle = 'rgba(255,255,255,0.4)'; G.fillRect(-w / 2 + 2, -h / 2 - 3, 8, 6); G.fillRect(w / 2 - 10, -h / 2 - 3, 8, 6);
    G.fillStyle = brakeHeld ? '#ff0000' : '#880000'; G.fillRect(-w / 2 + 3, h / 2 - 2, 6, 4); G.fillRect(w / 2 - 9, h / 2 - 2, 6, 4);
    if (brakeHeld || night > 0.2) { G.fillStyle = 'rgba(255,0,0,0.5)'; G.fillRect(-w / 2 + 2, h / 2 - 3, 8, 6); G.fillRect(w / 2 - 10, h / 2 - 3, 8, 6); }
  } else if (facingDown) {
    G.fillStyle = '#fff2b0'; G.fillRect(-w / 2 + 3, h / 2 - 2, 6, 4); G.fillRect(w / 2 - 9, h / 2 - 2, 6, 4);
    if (night > 0.2) { G.fillStyle = 'rgba(255,242,176,0.5)'; G.fillRect(-w / 2 + 2, h / 2 - 3, 8, 6); G.fillRect(w / 2 - 10, h / 2 - 3, 8, 6); }
  } else {
    G.fillStyle = brk ? '#ff0000' : '#ff3333'; G.fillRect(-w / 2 + 3, -h / 2 - 2, 6, 4); G.fillRect(w / 2 - 9, -h / 2 - 2, 6, 4);
    if (brk || night > 0.2) { G.fillStyle = 'rgba(255,0,0,0.5)'; G.fillRect(-w / 2 + 2, -h / 2 - 3, 8, 6); G.fillRect(w / 2 - 10, -h / 2 - 3, 8, 6); }
  }
  if (sig !== 0 && Math.floor(tick / 15) % 2 === 0) {
    G.fillStyle = '#ffb84d'; G.fillRect(sig === 1 ? w / 2 - 9 : -w / 2 + 3, facingDown ? h / 2 - 2 : -h / 2 - 2, 6, 4);
    G.fillStyle = 'rgba(255,184,77,0.5)'; G.fillRect(sig === 1 ? w / 2 - 10 : -w / 2 + 2, facingDown ? h / 2 - 3 : -h / 2 - 3, 8, 6);
  }
  G.restore();
  if (night > 0.1) {
    G.save(); G.translate(x, y); G.globalAlpha = night;
    const bLen = isP ? 280 : 200, sp = isP ? 70 : 50, ys = facingDown ? h / 2 : -h / 2, ye = facingDown ? h / 2 + bLen : -h / 2 - bLen;
    const grad = G.createLinearGradient(0, ys, 0, ye); grad.addColorStop(0, 'rgba(255,255,240,0.7)'); grad.addColorStop(1, 'rgba(255,255,240,0)');
    G.fillStyle = grad; G.beginPath(); G.moveTo(-w / 2 + 6, ys); G.lineTo(w / 2 - 6, ys); G.lineTo(w / 2 + sp, ye); G.lineTo(-w / 2 - sp, ye); G.closePath(); G.fill(); G.restore();
  }
}

function drawPickups() {
  pickups.forEach(p => {
    if (p.collected) return;
    const bob = Math.sin(Date.now() / 220 + p.x) * 4;
    G.save(); G.translate(p.x, p.y + bob);
    G.fillStyle = 'rgba(0,229,255,0.4)'; G.beginPath(); G.arc(0, 0, p.r + 6, 0, Math.PI * 2); G.fill();
    G.fillStyle = '#00e5ff'; G.beginPath(); G.arc(0, 0, p.r, 0, Math.PI * 2); G.fill();
    G.fillStyle = '#000'; G.font = 'bold 12px Arial, sans-serif'; G.textAlign = 'center'; G.textBaseline = 'middle'; G.fillText('N', 0, 1);
    G.restore();
  });
}

function drawPlayer() {
  if (nosHeld && nitroFuel > 0 && state === 'play') {
    G.save(); G.fillStyle = 'rgba(0,229,255,0.7)'; G.beginPath();
    G.moveTo(player.x - 6, player.y + player.h / 2); G.lineTo(player.x + 6, player.y + player.h / 2); G.lineTo(player.x, player.y + player.h / 2 + 35 + Math.random() * 15);
    G.closePath(); G.fill(); G.restore();
  }
  drawCar(player.x, player.y, player.w, player.h, player.color, false, true, false, 0, 'car');
}

/* ============== MAIN LOOP (fixed timestep) ============== */
function loop(timestamp) {
  gameLoopId = requestAnimationFrame(loop);
  if (!timestamp) timestamp = performance.now();
  if (isPaused || adPlaying) { lastTime = timestamp; acc = 0; return; }
  let dt = timestamp - lastTime; lastTime = timestamp;
  if (dt > 100) dt = frameInterval;           // tab switch / long stall: don't fast-forward
  acc += dt;
  let steps = 0;
  while (acc >= frameInterval - 0.5 && steps < 3) { frame(); acc -= frameInterval; steps++; }
  if (acc > frameInterval) acc = 0;           // too far behind: drop the backlog
}

function frame() {
  try {
    tick++; G.clearRect(0, 0, W, H);
    if (shakeAmt > 0.3) { shakeX = (Math.random() - 0.5) * shakeAmt * 2; shakeY = (Math.random() - 0.5) * shakeAmt * 2; shakeAmt *= 0.85; } else { shakeX = 0; shakeY = 0; shakeAmt = 0; }
    G.save(); G.translate(shakeX, shakeY);

    if (state === 'play') {
      updatePhysics(); updatePlayer(); updateTraffic(); updatePickups();
      if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) combo = 1; }
      spawnTimer--;
      if (spawnTimer <= 0) {
        spawnTraffic();
        const dubProb = Math.min(0.16 + (score / 1600) * 0.04, 0.80);
        if (Math.random() < dubProb) spawnTraffic();
        spawnTimer = Math.max(22, 78 - currentSpeed * 3 + Math.random() * 18);
      }
      pickupTimer--; if (pickupTimer <= 0) { spawnPickup(); pickupTimer = 200 + Math.floor(Math.random() * 100); }
      score += currentSpeed * 0.1; updateHud();
    }
    drawBackground(); drawRoad();
    if (state === 'play' || state === 'crash') {
      traffic.forEach(c => drawCar(c.x, c.y, c.w, c.h, c.color, c.oncoming, false, c.aiState === 'braking', c.turnSignal, c.type));
      drawPickups(); drawPlayer(); updateParticles(); drawParticles(); updatePopups(); drawPopups();
    }
    G.restore();
  } catch (err) {}
}

/* ============== BOOT ============== */
async function boot() {
  resizeGame();
  requestAnimationFrame(loop);          // menu background animates immediately
  CG.loadingStart();
  await CG.init();                      // CrazyGames SDK (continues normally if blocked / unavailable)
  bestOneWay = parseInt(dataGet('trafficEscape_OneWay', '0'), 10) || 0;
  bestTwoWay = parseInt(dataGet('trafficEscape_TwoWay', '0'), 10) || 0;
  best = isTwoWay ? bestTwoWay : bestOneWay;
  $('start-best').textContent = best + 'm';
  setLang(detectLang());
  booted = true;
  CG.loadingStop();
}
boot();
</script>
