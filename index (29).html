<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nitro Traffic Escape</title>
<style>
:root{ --lime:#c6ff3d; --cyan:#00e5ff; --amber:#ffb84d; --red:#ff3b4e; --bg:#05070a; --ink:#e9f1ff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --fd:"Arial Black","Segoe UI",Impact,Arial,sans-serif; --fb:"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{ width:100%; height:100%; position:fixed; inset:0; background:var(--bg); font-family:var(--fb); color:var(--ink); overflow:hidden; user-select:none; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; -webkit-touch-callout:none; touch-action:none; overscroll-behavior:none; }
#arena{ position:absolute; inset:0; overflow:hidden; }
canvas#c{ position:absolute; inset:0; width:100%; height:100%; display:block; background:#0a0e14; }
button{ font-family:inherit; color:inherit; }

/* ---- HUD ---- */
#hud{ position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .25s; }
#hud.on{ opacity:1; }
.hud-tl{ position:absolute; left:calc(14px + var(--sal)); top:calc(12px + var(--sat)); }
.lbl{ font-size:10px; letter-spacing:2px; color:rgba(255,255,255,.6); font-weight:700; text-transform:uppercase; }
.big{ font-family:var(--fd); font-size:26px; line-height:1.05; color:#fff; text-shadow:0 0 14px rgba(0,229,255,.55),0 2px 0 rgba(0,0,0,.5); }
.sub{ font-size:12px; color:rgba(255,255,255,.75); font-weight:700; margin-top:2px; }
.hud-tc{ position:absolute; left:50%; transform:translateX(-50%); top:calc(10px + var(--sat)); text-align:center; }
.speed{ font-family:var(--fd); font-size:30px; color:var(--cyan); text-shadow:0 0 16px rgba(0,229,255,.7),0 2px 0 rgba(0,0,0,.5); }
.speed small{ font-size:11px; color:rgba(255,255,255,.7); text-shadow:none; margin-left:4px; font-family:var(--fb); font-weight:700; }
#nbar{ width:150px; height:9px; margin:5px auto 0; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28); border-radius:6px; overflow:hidden; }
#nfill{ height:100%; width:60%; background:linear-gradient(90deg,#00e5ff,#c6ff3d); border-radius:6px; }
#nfill.low{ background:linear-gradient(90deg,#ff7a45,#ffb84d); }
.hud-tr{ position:absolute; right:calc(14px + var(--sar)); top:calc(58px + var(--sat)); text-align:right; }
#combo{ position:absolute; left:calc(14px + var(--sal)); top:calc(84px + var(--sat)); opacity:0; transition:opacity .15s; }
#combo .cv{ font-family:var(--fd); font-size:26px; color:var(--amber); text-shadow:0 0 14px var(--amber); }
#cbar{ width:86px; height:5px; background:rgba(255,255,255,.18); border-radius:3px; overflow:hidden; margin-top:2px; }
#cfill{ height:100%; width:100%; background:var(--amber); }
.top-btn{ position:absolute; top:calc(12px + var(--sat)); width:38px; height:38px; background:rgba(5,7,10,.62); border:1px solid rgba(0,229,255,.45); border-radius:10px; font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto; color:#fff; }
.top-btn:active{ transform:scale(.92); }
#btn-pause{ right:calc(60px + var(--sar)); } #btn-mute{ right:calc(14px + var(--sar)); }

/* ---- touch controls ---- */
#touch{ position:absolute; inset:0; pointer-events:none; display:none; }
body.touch #touch{ display:block; }
.cbtn{ position:absolute; bottom:calc(16px + var(--sab)); width:62px; height:62px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--fd); font-size:11px; letter-spacing:1px; pointer-events:auto; touch-action:none; border:2px solid rgba(255,255,255,.4); background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.22),rgba(255,255,255,.05)); color:#fff; }
.cbtn.active{ transform:scale(.92); background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),rgba(255,255,255,.12)); }
#b-left{ left:calc(12px + var(--sal)); } #b-right{ left:calc(84px + var(--sal)); }
#b-gas{ right:calc(12px + var(--sar)); width:82px; height:82px; bottom:calc(10px + var(--sab)); font-size:13px; border-color:var(--lime); background:radial-gradient(circle at 35% 30%,rgba(198,255,61,.55),rgba(100,180,0,.25)); box-shadow:0 0 22px rgba(198,255,61,.3); }
#b-brake{ right:calc(106px + var(--sar)); border-color:var(--red); background:radial-gradient(circle at 35% 30%,rgba(255,59,78,.5),rgba(180,0,0,.22)); }
#b-nitro{ right:calc(22px + var(--sar)); width:60px; height:60px; bottom:calc(104px + var(--sab)); border-color:var(--cyan); background:radial-gradient(circle at 35% 30%,rgba(0,229,255,.55),rgba(0,150,180,.25)); box-shadow:0 0 22px rgba(0,229,255,.35); }

/* ---- hint / toast ---- */
#hint{ position:absolute; left:50%; bottom:calc(120px + var(--sab)); transform:translateX(-50%); background:rgba(5,7,10,.72); border:1px solid rgba(255,255,255,.2); border-radius:12px; padding:10px 16px; font-size:13px; font-weight:700; line-height:1.7; text-align:center; opacity:0; transition:opacity .4s; pointer-events:none; white-space:nowrap; }
#hint.on{ opacity:1; }
#toast{ position:absolute; left:50%; top:calc(110px + var(--sat)); transform:translate(-50%,-10px); background:linear-gradient(90deg,#1c7a3a,#2fbf62); border-radius:12px; padding:9px 18px; font-weight:800; font-size:14px; opacity:0; transition:all .3s; pointer-events:none; z-index:60; text-align:center; }
#toast.on{ opacity:1; transform:translate(-50%,0); }

/* ---- screens ---- */
.screen{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .3s; z-index:20; padding:calc(10px + var(--sat)) calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal)); background:linear-gradient(180deg,rgba(5,7,12,.2),rgba(5,7,12,.78)); }
.screen.on{ opacity:1; pointer-events:auto; }
.screen.dim{ background:rgba(5,7,12,.82); backdrop-filter:blur(6px); }
.panel{ width:100%; max-width:420px; max-height:100%; overflow-y:auto; text-align:center; padding:14px; }
.logo{ font-family:var(--fd); line-height:.95; margin-bottom:14px; text-shadow:0 4px 0 rgba(0,0,0,.45); }
.logo .l0{ display:block; font-size:clamp(18px,5vw,24px); color:var(--cyan); letter-spacing:.35em; text-shadow:0 0 18px rgba(0,229,255,.8); }
.logo .l1{ display:block; font-size:clamp(34px,10vw,52px); color:#fff; font-style:italic; }
.logo .l2{ display:block; font-size:clamp(40px,12vw,62px); color:var(--lime); font-style:italic; text-shadow:0 0 26px rgba(198,255,61,.65),0 4px 0 rgba(0,0,0,.45); }
.chips{ display:flex; justify-content:center; gap:10px; margin-bottom:12px; font-weight:800; font-size:13px; }
.chip{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); padding:6px 12px; border-radius:20px; }
.chip b{ color:var(--amber); }
.seg{ display:flex; justify-content:center; gap:8px; margin-bottom:14px; }
.seg button{ padding:8px 16px; border-radius:8px; background:transparent; border:1px solid rgba(255,255,255,.3); font-weight:700; font-size:13px; cursor:pointer; }
.seg button.active{ background:var(--cyan); color:#001018; border-color:var(--cyan); box-shadow:0 0 16px rgba(0,229,255,.5); }
.gbtn{ display:block; width:82%; margin:7px auto; padding:14px 22px; background:transparent; border:2px solid var(--lime); color:var(--lime); font-family:var(--fd); font-size:14px; letter-spacing:2px; cursor:pointer; clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%); text-transform:uppercase; }
.gbtn:active{ background:var(--lime); color:#000; }
.gbtn.play{ background:var(--lime); color:#0a1400; font-size:18px; padding:16px; box-shadow:0 0 24px rgba(198,255,61,.35); }
.gbtn.blue{ border-color:var(--cyan); color:var(--cyan); } .gbtn.blue:active{ background:var(--cyan); color:#000; }
.gbtn.amber{ border-color:var(--amber); color:var(--amber); } .gbtn.amber:active{ background:var(--amber); color:#000; }
.gbtn.dis{ opacity:.45; pointer-events:none; }
.row2{ display:flex; gap:10px; justify-content:center; width:86%; margin:0 auto; }
.row2 .gbtn{ width:50%; margin:7px 0; font-size:12px; padding:12px 8px; }
.langs{ display:flex; justify-content:center; gap:6px; margin-top:12px; align-items:center; }
.lang-btn,.snd{ background:transparent; border:1px solid rgba(255,255,255,.25); color:rgba(255,255,255,.65); font-size:11px; font-weight:800; padding:5px 8px; border-radius:6px; cursor:pointer; }
.lang-btn.active{ background:rgba(0,229,255,.2); color:var(--cyan); border-color:var(--cyan); }
.htitle{ font-family:var(--fd); font-size:22px; margin-bottom:6px; }
.htitle.red{ color:var(--red); text-shadow:0 0 18px rgba(255,59,78,.7); font-size:30px; }
.bigscore{ font-family:var(--fd); font-size:44px; color:#fff; text-shadow:0 0 18px rgba(0,229,255,.5); }
.newbest{ color:var(--amber); font-weight:800; letter-spacing:2px; margin:4px 0; display:none; }
.stats{ display:flex; justify-content:center; gap:18px; margin:10px 0 14px; font-size:13px; font-weight:700; color:rgba(255,255,255,.8); }
.stats b{ display:block; font-family:var(--fd); font-size:18px; color:#fff; }
.ctrl{ margin:10px 0; font-size:13px; line-height:1.8; color:rgba(255,255,255,.8); }
.card{ background:rgba(14,20,34,.92); border:1px solid rgba(255,255,255,.15); border-radius:14px; padding:14px; margin:0 auto; text-align:left; width:100%; max-width:430px; max-height:100%; overflow-y:auto; }
.card-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.card-h h2{ font-family:var(--fd); font-size:20px; }
.back{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:7px 12px; font-weight:800; font-size:12px; cursor:pointer; }
#gcar{ display:block; width:min(100%,300px); height:auto; margin:4px auto 0; }
.gnav{ display:flex; align-items:center; justify-content:space-between; }
.arrow{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); width:42px; height:42px; border-radius:50%; font-size:18px; cursor:pointer; }
.gname{ text-align:center; font-family:var(--fd); font-size:18px; letter-spacing:2px; }
.gprice{ text-align:center; color:var(--amber); font-weight:800; font-size:13px; margin:2px 0 8px; min-height:16px; }
.bar{ display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; margin:4px 0; }
.bar span{ width:64px; color:rgba(255,255,255,.7); }
.bar i{ flex:1; height:7px; background:rgba(255,255,255,.12); border-radius:4px; overflow:hidden; display:block; }
.bar i em{ display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--lime)); }
.sep{ height:1px; background:rgba(255,255,255,.12); margin:12px 0; }
.upg{ display:flex; align-items:center; gap:8px; margin:7px 0; font-size:12px; font-weight:700; }
.upg .nm{ width:92px; } .pips{ display:flex; gap:3px; flex:1; } .pips u{ flex:1; height:7px; border-radius:3px; background:rgba(255,255,255,.14); text-decoration:none; } .pips u.on{ background:var(--lime); }
.ubtn{ background:transparent; border:1.5px solid var(--amber); color:var(--amber); font-weight:800; font-size:11px; padding:6px 9px; border-radius:7px; cursor:pointer; min-width:70px; }
.ubtn.dis{ opacity:.4; pointer-events:none; } .ubtn.max{ border-color:rgba(255,255,255,.3); color:rgba(255,255,255,.6); }
.mis{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:10px 12px; margin:9px 0; }
.mis .t{ font-weight:800; font-size:13px; display:flex; justify-content:space-between; gap:8px; } .mis .t b{ color:var(--amber); white-space:nowrap; }
.mis .pb{ height:7px; background:rgba(255,255,255,.14); border-radius:4px; margin-top:8px; overflow:hidden; } .mis .pb i{ display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--lime)); }
.hide{ display:none !important; }
.dmg{ display:flex; align-items:center; gap:8px; margin:7px 0; font-size:12px; font-weight:700; } .dmg .nm{ width:112px; } .dmg .db{ flex:1; height:7px; background:rgba(255,255,255,.12); border-radius:4px; overflow:hidden; } .dmg .db i{ display:block; height:100%; background:linear-gradient(90deg,#ffb84d,#ff3b4e); }
.gbtn.warn{ border-color:var(--red) !important; color:var(--red) !important; }
.okmsg{ color:var(--lime); font-size:12px; font-weight:800; text-align:center; margin:6px 0; }

.swatches{ display:flex; flex-wrap:wrap; gap:6px 10px; margin:8px 0 18px; }
.sw{ width:32px; height:32px; border-radius:50%; border:2px solid rgba(255,255,255,.3); position:relative; cursor:pointer; }
.sw.on{ border-color:#fff; box-shadow:0 0 0 3px var(--lime); }
.sw small{ position:absolute; left:50%; top:100%; transform:translateX(-50%); font-size:9px; font-weight:800; color:var(--amber); white-space:nowrap; margin-top:2px; }
.sw.lock{ opacity:.8; }
#b-horn{right:calc(96px + var(--sar));bottom:calc(86px + var(--sab));width:50px;height:50px;font-size:20px;} #btn-cam{right:calc(106px + var(--sar));}
.tcs{display:flex;gap:10px;overflow-x:auto;padding:6px 4px;}
.tc{flex:0 0 130px;border-radius:12px;border:3px solid var(--c);background:var(--c);cursor:pointer;position:relative;overflow:hidden;text-align:center;}
.tc .pv{height:84px;position:relative;background:linear-gradient(180deg,var(--s) 0 38%,transparent 38%),linear-gradient(90deg,var(--g) 0 24%,var(--r) 24% 76%,var(--g) 76%);}
.tc .pv i{position:absolute;left:50%;top:38%;bottom:0;width:3px;margin-left:-1px;background:repeating-linear-gradient(180deg,#f2c230 0 8px,transparent 8px 16px);}
.tc b{display:block;padding:6px 2px;font-family:var(--fd);font-size:12px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5);}
.tc.on{box-shadow:0 0 0 3px #fff,0 0 16px var(--c);} .tc.lock .pv{filter:grayscale(1) brightness(.55);} .tc.lock{filter:grayscale(.8);}
.tc .lk{position:absolute;left:0;right:0;top:10px;font-size:30px;text-shadow:0 2px 4px #000;}
.tc .pr{position:absolute;left:12px;right:12px;top:50px;background:linear-gradient(#ffc83d,#e08a10);color:#2a1800;font-weight:900;font-size:12px;border-radius:4px;padding:2px 0;}
.th{display:inline-block;margin:3px;padding:6px 10px;border:1px solid rgba(255,255,255,.3);border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;} .th.on{border-color:var(--lime);color:var(--lime);}
input[type=range]{touch-action:pan-x;pointer-events:auto;}
@media (max-height:460px){
  #b-horn{bottom:calc(74px + var(--sab));right:calc(86px + var(--sar));width:44px;height:44px;}
  .logo{ margin-bottom:6px; } .logo .l0{ font-size:14px; } .logo .l1{ font-size:30px; } .logo .l2{ font-size:36px; }
  .chips{ margin-bottom:6px; } .seg{ margin-bottom:8px; } .gbtn{ padding:9px 16px; margin:4px auto; font-size:12px; } .gbtn.play{ padding:11px; font-size:15px; }
  .langs{ margin-top:6px; } .htitle{ font-size:18px; } .htitle.red{ font-size:22px; } .bigscore{ font-size:30px; } .stats{ margin:6px 0 8px; }
  .panel{ padding:6px; } .card{ padding:10px; } #gcar{ width:min(100%,190px); } .mis{ margin:6px 0; padding:8px 10px; }
  .cbtn{ width:54px; height:54px; } #b-right{ left:calc(76px + var(--sal)); } #b-gas{ width:66px; height:66px; } #b-brake{ right:calc(90px + var(--sar)); } #b-nitro{ width:50px; height:50px; bottom:calc(84px + var(--sab)); right:calc(20px + var(--sar)); }
  .big{ font-size:20px; } .speed{ font-size:24px; } #hint{ bottom:calc(84px + var(--sab)); font-size:12px; padding:6px 12px; line-height:1.5; }
}
</style>
</head>
<body>
<div id="arena">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="hud-tl"><div class="lbl" data-i="score">SCORE</div><div class="big" id="h-score">0</div><div class="sub"><span id="h-dist">0</span> m</div></div>
    <div class="hud-tc"><div class="speed"><span id="h-speed">0</span><small>km/h</small></div><div id="nbar"><div id="nfill"></div></div></div>
    <div class="hud-tr"><div class="lbl" data-i="coins">COINS</div><div class="sub" style="font-size:15px;color:var(--amber)">🪙 <span id="h-coins">0</span></div></div>
    <div id="combo"><div class="lbl" data-i="combo">COMBO</div><div class="cv" id="h-combo">x1</div><div id="cbar"><div id="cfill"></div></div></div>
    <div id="btn-cam" class="top-btn">📷</div><div id="btn-pause" class="top-btn">⏸</div><div id="btn-mute" class="top-btn">🔊</div>
  </div>

  <div id="touch">
    <div id="b-left" class="cbtn">◀</div><div id="b-right" class="cbtn">▶</div>
    <div id="b-brake" class="cbtn" data-i="brake">BRAKE</div><div id="b-horn" class="cbtn">📯</div><div id="b-nitro" class="cbtn" data-i="nos">NITRO</div><div id="b-gas" class="cbtn" data-i="gas">GAS</div>
  </div>
  <div id="hint"></div><div id="toast"></div>

  <!-- MENU -->
  <div id="menu" class="screen on"><div class="panel">
    <div class="logo"><span class="l0">NITRO</span><span class="l1">TRAFFIC</span><span class="l2">ESCAPE</span></div>
    <div class="chips"><div class="chip">🪙 <b id="m-coins">0</b></div><div class="chip"><span data-i="best">BEST</span> <b id="m-best">0 m</b></div></div>
    <div class="seg"><button id="mode-one" data-i="oneway">One way</button><button id="mode-two" class="active" data-i="twoway">Two way</button></div>
    <button class="gbtn play" id="b-play" data-i="play">PLAY</button>
    <div class="row2"><button class="gbtn blue" id="b-garage" data-i="garage">GARAGE</button><button class="gbtn amber" id="b-missions" data-i="missions">MISSIONS</button></div>
    <button class="gbtn blue" id="b-themes" data-i="theme">LOCATION</button>
    <button class="gbtn amber" id="b-guide" data-i="settings">SETTINGS</button>
    <div class="langs"><button class="lang-btn" data-l="en">EN</button><button class="lang-btn" data-l="tr">TR</button><button class="lang-btn" data-l="es">ES</button><button class="lang-btn" data-l="ru">RU</button><button class="lang-btn" data-l="zh">ZH</button><button class="snd" id="m-snd">🔊</button></div>
  </div></div>

  <!-- GARAGE -->
  <div id="garage" class="screen dim"><div class="card">
    <div class="card-h"><h2 data-i="garage_title">Garage</h2><div class="chip" style="font-size:13px;font-weight:800">🪙 <b id="g-coins" style="color:var(--amber)">0</b></div><button class="back" id="g-back" data-i="back">Back</button></div>
    <canvas id="gcar" width="300" height="190"></canvas>
    <div class="gnav"><button class="arrow" id="g-prev">◀</button><div><div class="gname" id="g-name">STREET</div><div class="gprice" id="g-price"></div></div><button class="arrow" id="g-next">▶</button></div>
    <div class="bar"><span data-i="s_speed">Speed</span><i><em id="st-speed"></em></i></div>
    <div class="bar"><span data-i="s_handling">Handling</span><i><em id="st-hand"></em></i></div>
    <div class="bar"><span data-i="s_nitro">Nitro</span><i><em id="st-nit"></em></i></div>
    <div class="bar"><span data-i="s_armor">Armor</span><i><em id="st-arm"></em></i></div>
    <button class="gbtn blue" id="g-act" style="width:100%;margin:12px 0 0">SELECT</button>
    <div class="sep"></div><div id="g-upg"></div>
    <div class="sep"></div><div class="lbl" data-i="paint">PAINT</div><div class="swatches" id="g-paint"></div><div id="g-pconf"></div>
    <div class="sep"></div><div class="lbl" data-i="damage">DAMAGE</div><div id="g-dmg"></div>
  </div></div>

  <!-- THEMES -->
  <div id="themes" class="screen dim"><div class="card">
    <div class="card-h"><h2 data-i="theme">LOCATION</h2><div class="chip">🪙 <b id="t-coins" style="color:var(--amber)">0</b></div><button class="back" id="t-back" data-i="back">Back</button></div>
    <div class="tcs" id="th-list"></div>
  </div></div>

  <!-- MISSIONS -->
  <div id="missions" class="screen dim"><div class="card">
    <div class="card-h"><h2 data-i="missions_title">Missions</h2><button class="back" id="ms-back" data-i="back">Back</button></div>
    <div id="ms-list"></div>
  </div></div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim"><div class="panel">
    <div class="htitle" data-i="paused">Paused</div>
    <div class="ctrl" id="p-ctrl"></div>
    <button class="gbtn play" id="p-resume" data-i="resume">Resume</button>
    <button class="gbtn amber" id="p-restart" data-i="restart">Restart</button>
    <button class="gbtn amber" id="p-guide" data-i="settings">SETTINGS</button>

<script>
'use strict';
/* ===== CrazyGames SDK wrapper. Everything is guarded, so the game also runs without the SDK (AdBlock, local test). ===== */
const Platform = {
  ready: false, playing: false, adActive: false,
  sdk() { return (window.CrazyGames && window.CrazyGames.SDK) || null; },
  async init() {
    const s = this.sdk(); if (!s) return;
    try {
      await Promise.race([
        Promise.resolve(s.init()).then(() => { this.ready = true; }),
        new Promise(r => setTimeout(r, 3000))
      ]);
    } catch (e) {}
    this.hookMute();
  },
  hookMute() {
    try {
      const g = this.sdk().game;
      if (g.addSettingsChangeListener) g.addSettingsChangeListener(st => { Aud.setExternalMute(!!(st && st.muteAudio)); });
      if (g.settings && g.settings.muteAudio) Aud.setExternalMute(true);
    } catch (e) {}
  },
  loadingStart() { try { if (this.sdk() && this.sdk().game.loadingStart) this.sdk().game.loadingStart(); } catch (e) {} },
  loadingStop() { try { if (this.sdk() && this.sdk().game.loadingStop) this.sdk().game.loadingStop(); } catch (e) {} },
  gameplayStart() { if (this.playing) return; this.playing = true; try { if (this.ready) this.sdk().game.gameplayStart(); } catch (e) {} },
  gameplayStop() { if (!this.playing) return; this.playing = false; try { if (this.ready) this.sdk().game.gameplayStop(); } catch (e) {} },
  happytime() { try { if (this.ready && this.sdk().game.happytime) this.sdk().game.happytime(); } catch (e) {} },
  locale() { try { if (this.ready) return this.sdk().user.systemInfo.locale || ''; } catch (e) {} return ''; },
  getItem(k) {
    try { if (this.ready && this.sdk().data) { const v = this.sdk().data.getItem(k); if (v !== null && v !== undefined) return v; } } catch (e) {}
    try { return localStorage.getItem(k); } catch (e) { return null; }
  },
  setItem(k, v) {
    try { if (this.ready && this.sdk().data) this.sdk().data.setItem(k, v); } catch (e) {}
    try { localStorage.setItem(k, v); } catch (e) {}
  },
  /* Ad helpers: resolve(true) only if the ad was really shown / finished */
  _ad(type) {
    this.gameplayStop();
    this.adActive = true; Aud.pauseAll();
    return new Promise(resolve => {
      let done = false;
      const fin = ok => { if (done) return; done = true; this.adActive = false; Aud.resumeAll(); resolve(ok); };
      const s = this.sdk();
      if (!this.ready || !s || !s.ad) { fin(false); return; }
      try { s.ad.requestAd(type, { adStarted: () => {}, adFinished: () => fin(true), adError: () => fin(false) }); }
      catch (e) { fin(false); }
    });
  },
  midgame() { return this._ad('midgame'); },
  rewarded() { return this._ad('rewarded'); }
};

const D_KEYS = [['e', 'd_engine'], ['c', 'd_chassis'], ['n', 'd_nitro']];
let gRepair = null, gP = [], gSp = [], gPrev;

function shownDmg() {

function startRepair(keys) {

  const off = e => { e.preventDefault(); Game.inp[key] = false; el.classList.remove('active'); };

(function () { const el = $('b-horn'), on = e => { e.preventDefault(); if (uiState === 'play') { Aud.hornOn(); Game.honk(); } el.classList.add('active'); try { el.setPointerCapture(e.pointerId); } catch (x) {} }, off = e => { e.preventDefault(); Aud.hornOff(); el.classList.remove('active'); }; el.addEventListener('pointerdown', on); ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => el.addEventListener(n, off)); })();

/* ---------- canvas sizing + main loop ---------- */
const canvas = $('c');
function resizeAll() {

}

let popT = 0, brkT = 0, wasBrk = false; const STEP = 1 / 60; let last = 0, acc = 0, hudCache = {};

function updateHud() {
  const h = Game.getHud();
  setTxt('h-score', h.score.toLocaleString()); setTxt('h-dist', h.dist.toLocaleString()); setTxt('h-speed', String(h.kmh)); setTxt('h-coins', (Save.d.coins + h.runCoins).toLocaleString());
  $('nfill').style.width = h.nitro.toFixed(0) + '%'; $('nfill').classList.toggle('low', h.nitro < 20);
  const cb = $('combo'); cb.style.opacity = h.combo > 1 ? '1' : '0'; setTxt('h-combo', 'x' + h.combo); $('cfill').style.width = (h.comboPct * 100).toFixed(0) + '%';
}

  Game.render();

  if (uiState === 'play') {
    updateHud();
    popT -= dt; brkT -= dt;
    { const sc = carOf(Save.d.sel), pct = Game.getSpeedPct(), live = !Game.isCrashed();
      if (popT <= 0 && sc.shape === 'sport' && pct > sc.top * 0.72 && live) { Aud.sfx('backfire'); Game.backfire(); popT = Game.inp.gas ? 0.7 + Math.random() * 1.6 : 0.2 + Math.random() * 0.5; }
      const braking = Game.inp.brake && pct > 0.25 && live;

  }
}

  Platform.loadingStop();

boot().catch(function (e) { try { console.error(e); goMenu(); requestAnimationFrame(function (t) { last = t; requestAnimationFrame(loop); }); } catch (x) {} });
